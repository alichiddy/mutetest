name: Build GestureVolume
on:
  workflow_dispatch:
  push:
    paths:
      - 'GestureVolume.zip'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.WORKFLOW_PAT || github.token }}
      - name: Use the newest zip uploaded to the gv release (phone upload)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R="$GITHUB_REPOSITORY"
          N=$(gh release view gv -R "$R" --json assets --jq '[.assets[] | select(.name | endswith(".zip"))] | sort_by(.createdAt) | last | .name // empty' 2>/dev/null || true)
          if [ -n "$N" ]; then
            gh release download gv -R "$R" --pattern "$N" --output GestureVolume.zip --clobber
            echo "Downloaded source asset: $N"
            ls -lh GestureVolume.zip
            sha256sum GestureVolume.zip
          fi
      - name: Install a new workflow file uploaded to the gv release (needs the WORKFLOW_PAT secret)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_PAT: ${{ secrets.WORKFLOW_PAT != '' }}
        run: |
          R="$GITHUB_REPOSITORY"
          Y=$(gh release view gv -R "$R" --json assets --jq '[.assets[] | select(.name | endswith(".yml"))] | sort_by(.createdAt) | last | .name // empty' 2>/dev/null || true)
          if [ -n "$Y" ] && [ "$HAS_PAT" = "true" ]; then
            gh release download gv -R "$R" --pattern "$Y" --output new.yml --clobber
            if ! cmp -s new.yml .github/workflows/gesturevolume.yml; then
              cp new.yml .github/workflows/gesturevolume.yml
              git config user.name "gv-bot"; git config user.email "gv-bot@users.noreply.github.com"
              git add .github/workflows/gesturevolume.yml
              git commit -m "Update gesturevolume.yml from phone upload"
              git push
            fi
            rm -f new.yml
            for A in $(gh release view gv -R "$R" --json assets --jq '.assets[].name'); do
              case "$A" in *.yml) gh release delete-asset gv "$A" -R "$R" -y || true;; esac
            done
          fi
      - name: Extract the canonical B364 project
        run: |
          echo "Checking uploaded B364 source archive..."
          file GestureVolume.zip
          ls -lh GestureVolume.zip
          sha256sum GestureVolume.zip
          if ! unzip -t GestureVolume.zip; then
            echo "::error::The uploaded GestureVolume.zip failed ZIP integrity validation. The unzip diagnostic above identifies the exact archive error. The release asset has been preserved."
            exit 1
          fi
          if ! unzip -Z1 GestureVolume.zip | grep -qx 'GestureVolume/gradlew'; then
            echo "::error::GestureVolume.zip is valid but is not a complete project. Upload the full GestureVolume/ project ZIP."
            exit 1
          fi
          echo "Extracting validated complete B364 project."
          unzip -q GestureVolume.zip
          test -f GestureVolume/gradlew
          test -f GestureVolume/gradle/wrapper/gradle-wrapper.jar
          test -f GestureVolume/debug.keystore
          test -f GestureVolume/app/build.gradle.kts
          echo "B364 project layout and bundled signing key verified."
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
      - name: Dummy secrets (ads are switched off with -PnoAds)
        working-directory: GestureVolume
        run: |
          cat > local.properties <<'EOF'
          APPLOVIN_SDK_KEY=dummy
          AD_UNIT_BANNER=dummy
          AD_UNIT_INTERSTITIAL=dummy
          AD_UNIT_NATIVE=dummy
          AD_UNIT_APP_OPEN=dummy
          PRODUCT_LIFETIME=dummy
          EOF
      - name: Speed only - skip the release lint-vital check (delete this step and the -I below to turn it back on)
        run: |
          cat > "$RUNNER_TEMP/gv-init.gradle" <<'EOF'
          allprojects {
              tasks.configureEach { t ->
                  if (t.name.startsWith('lintVital')) { t.enabled = false }
              }
          }
          EOF
      - name: Build
        working-directory: GestureVolume
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -I "$RUNNER_TEMP/gv-init.gradle" -PnoAds -Psideload -PbuildNo=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: GestureVolume
          path: GestureVolume/app/build/outputs/apk/release/app-release.apk
          compression-level: 0
      - name: Publish the APK to the gv release (direct download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload gv "GestureVolume/app/build/outputs/apk/release/app-release.apk#GestureVolume.apk" --clobber -R "$GITHUB_REPOSITORY"
