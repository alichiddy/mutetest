      - name: Dummy secrets (ads are switched off with -PnoAds)
        run: |
          cat > local.properties <<'EOF'
          APPLOVIN_SDK_KEY=dummy
          AD_UNIT_BANNER=dummy
          AD_UNIT_INTERSTITIAL=dummy
          AD_UNIT_NATIVE=dummy
          AD_UNIT_APP_OPEN=dummy
          PRODUCT_LIFETIME=dummy
          EOF

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PnoAds -Psideload -PbuildNo=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: GestureVolume
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish the APK to the gv release (direct download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload gv "app/build/outputs/apk/release/app-release.apk#GestureVolume.apk" --clobber -R "$GITHUB_REPOSITORY"
