name: Build GestureVolume
on:
  workflow_dispatch:
  push:
    paths:
      - 'GestureVolume.zip'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.WORKFLOW_PAT || github.token }}
      - name: Use the newest zip uploaded to the gv release (phone upload)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R="$GITHUB_REPOSITORY"
          N=$(gh release view gv -R "$R" --json assets --jq '[.assets[] | select(.name | endswith(".zip"))] | sort_by(.createdAt) | last | .name // empty' 2>/dev/null || true)
          if [ -n "$N" ]; then
            gh release download gv -R "$R" --pattern "$N" --output GestureVolume.zip --clobber
            for A in $(gh release view gv -R "$R" --json assets --jq '.assets[].name'); do
              case "$A" in *.yml) continue;; esac
              gh release delete-asset gv "$A" -R "$R" -y || true
            done
          fi
      - name: Install a new workflow file uploaded to the gv release (needs the WORKFLOW_PAT secret)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_PAT: ${{ secrets.WORKFLOW_PAT != '' }}
        run: |
          R="$GITHUB_REPOSITORY"
          Y=$(gh release view gv -R "$R" --json assets --jq '[.assets[] | select(.name | endswith(".yml"))] | sort_by(.createdAt) | last | .name // empty' 2>/dev/null || true)
          if [ -n "$Y" ] && [ "$HAS_PAT" = "true" ]; then
            gh release download gv -R "$R" --pattern "$Y" --output new.yml --clobber
            if ! cmp -s new.yml .github/workflows/gesturevolume.yml; then
              cp new.yml .github/workflows/gesturevolume.yml
              git config user.name "gv-bot"; git config user.email "gv-bot@users.noreply.github.com"
              git add .github/workflows/gesturevolume.yml
              git commit -m "Update gesturevolume.yml from phone upload"
              git push
            fi
            rm -f new.yml
            for A in $(gh release view gv -R "$R" --json assets --jq '.assets[].name'); do
              case "$A" in *.yml) gh release delete-asset gv "$A" -R "$R" -y || true;; esac
            done
          fi
      - run: unzip -q GestureVolume.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
      - name: Dummy secrets (ads are switched off with -PnoAds)
        working-directory: GestureVolume
        run: |
          cat > local.properties <<'EOF'
          APPLOVIN_SDK_KEY=dummy
          AD_UNIT_BANNER=dummy
          AD_UNIT_INTERSTITIAL=dummy
          AD_UNIT_NATIVE=dummy
          AD_UNIT_APP_OPEN=dummy
          PRODUCT_LIFETIME=dummy
          EOF
      - name: Build
        working-directory: GestureVolume
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PnoAds -Psideload -PbuildNo=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: GestureVolume
          path: GestureVolume/app/build/outputs/apk/release/app-release.apk
      - name: Publish the APK to the gv release (direct download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload gv "GestureVolume/app/build/outputs/apk/release/app-release.apk#GestureVolume.apk" --clobber -R "$GITHUB_REPOSITORY"
